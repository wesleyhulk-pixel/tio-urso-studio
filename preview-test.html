<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#e7f0ed;font-family:Arial;}.grid{display:flex; gap:1em;flex-wrap:wrap}.item{background:#ddd;padding:10px;text-align:center;}canvas{background:linear-gradient(#ddf0e3 76%,#995f40 76%);width:500px;height:500px;border:1px solid #bbb;}</style></head><body><div class="grid"><div class="item"><h3>Frente 0°</h3><canvas id="front" width="500" height="500"></canvas></div><div class="item"><h3>Trás 180°</h3><canvas id="back" width="500" height="500"></canvas></div></div><script src="mock3d.js"></script><script>
